<title>eBIRForms Shell Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: unified 40px title bar over a 248px left rail, a rounded inset main surface, and a 320px right panel that serves either the tax profile or notifications */
:root{
  --bg:#f4f4f6; --surface:#ffffff; --raised:#ffffff; --hover:#ebebee; --selected:#e2e2e7;
  --border:#e2e2e6; --border-strong:#cdcdd3;
  --fg:#18181b; --fg-2:#54545d; --fg-3:#8a8a93;
  --primary:#18181b; --primary-fg:#ffffff;
  --accent:#2557d6; --accent-soft:rgba(37,87,214,.10); --focus:rgba(37,87,214,.45);
  --success:#157a3c; --success-soft:rgba(21,122,60,.10);
  --warning:#a5520a; --warning-soft:rgba(196,110,10,.13);
  --danger:#c0262d; --danger-soft:rgba(192,38,45,.10);
  --scrim:rgba(24,24,27,.30);
  --shadow:0 1px 2px rgba(20,20,30,.04),0 10px 30px rgba(20,20,30,.08);
  --pop:0 4px 12px rgba(20,20,30,.08),0 18px 44px rgba(20,20,30,.14);
  --av-s:55%; --av-bg:90%; --av-fg:30%;
  --font-ui:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:"Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-num:var(--font-ui); /* TIN, branch and form codes: UI face + tabular digits, never monospace */
  --fs-cap:11px; --fs-meta:12px; --fs-body:13px; --fs-emph:14px; --fs-title:16px; --fs-page:20px;
  --r-ctl:6px; --r-row:8px; --r-card:12px; --r-dialog:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0e10; --surface:#161619; --raised:#232328; --hover:#1f1f23; --selected:#29292f;
  --border:#25252a; --border-strong:#38383f;
  --fg:#f3f3f5; --fg-2:#a7a7b1; --fg-3:#73737d;
  --primary:#f3f3f5; --primary-fg:#111113;
  --accent:#7ea2ff; --accent-soft:rgba(126,162,255,.14); --focus:rgba(126,162,255,.55);
  --success:#5bd68a; --success-soft:rgba(91,214,138,.12);
  --warning:#f3b44a; --warning-soft:rgba(243,180,74,.13);
  --danger:#ff7b7b; --danger-soft:rgba(255,123,123,.12);
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.45);
  --pop:0 4px 12px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55);
  --av-s:40%; --av-bg:26%; --av-fg:84%;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e0e10; --surface:#161619; --raised:#232328; --hover:#1f1f23; --selected:#29292f;
  --border:#25252a; --border-strong:#38383f;
  --fg:#f3f3f5; --fg-2:#a7a7b1; --fg-3:#73737d;
  --primary:#f3f3f5; --primary-fg:#111113;
  --accent:#7ea2ff; --accent-soft:rgba(126,162,255,.14); --focus:rgba(126,162,255,.55);
  --success:#5bd68a; --success-soft:rgba(91,214,138,.12);
  --warning:#f3b44a; --warning-soft:rgba(243,180,74,.13);
  --danger:#ff7b7b; --danger-soft:rgba(255,123,123,.12);
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.45);
  --pop:0 4px 12px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55);
  --av-s:40%; --av-bg:26%; --av-fg:84%;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:var(--fs-body)/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.page{height:100%;display:flex;flex-direction:column;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* prototype bar */
.proto{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.proto .ttl{font-weight:600;font-size:var(--fs-emph)}
.proto .sub{color:var(--fg-3);font-size:var(--fs-meta)}
.proto .grow{flex:1}
.proto label{font-size:var(--fs-meta);color:var(--fg-3);display:inline-flex;align-items:center;gap:8px}

/* primitives */
.ibtn{width:28px;height:28px;display:inline-grid;place-items:center;border:0;border-radius:var(--r-ctl);background:transparent;color:var(--fg-2);cursor:pointer;position:relative;flex-shrink:0}
.ibtn:hover{background:var(--hover);color:var(--fg)}
.ibtn[aria-pressed="true"]{background:var(--selected);color:var(--fg)}
.ibtn:disabled{color:var(--fg-3);opacity:.5;cursor:default;background:transparent}
.ibtn .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid transparent;background:transparent;font-weight:500;font-size:var(--fs-body);cursor:pointer;white-space:nowrap;color:var(--fg)}
.btn.sm{height:28px;padding:0 10px}
.btn.primary{background:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{opacity:.88}
.btn.secondary{background:var(--surface);border-color:var(--border-strong)}
.btn.secondary:hover{background:var(--hover)}
.btn.ghost{color:var(--fg-2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.danger:hover{filter:brightness(.97)}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 8px;border:0;border-radius:var(--r-row);background:transparent;color:var(--fg-2);font-weight:500;text-align:left;cursor:pointer}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav[aria-current="page"]{background:var(--selected);color:var(--fg)}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .count{font-size:var(--fs-meta);color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav .trail{color:var(--fg-3)}
.glabel{font-size:var(--fs-meta);font-weight:500;color:var(--fg-3);padding:16px 8px 4px}
.av{display:inline-grid;place-items:center;border-radius:50%;flex-shrink:0;font-weight:600;letter-spacing:.02em;background:hsl(var(--h) var(--av-s) var(--av-bg));color:hsl(var(--h) var(--av-s) var(--av-fg))}
.av.s20{width:20px;height:20px;font-size:9px}
.av.s28{width:28px;height:28px;font-size:11px}
.av.s40{width:40px;height:40px;font-size:14px}
.av.s56{width:56px;height:56px;font-size:19px}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:var(--fs-cap);font-weight:500;background:var(--hover);color:var(--fg-2);white-space:nowrap}
.chip svg.i{width:12px;height:12px}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.success{background:var(--success-soft);color:var(--success)}
.chip.warning{background:var(--warning-soft);color:var(--warning)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.switch{position:relative;width:32px;height:18px;border-radius:999px;border:0;background:var(--border-strong);cursor:pointer;flex-shrink:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r-row);background:var(--hover)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:0;border-radius:var(--r-ctl);background:transparent;color:var(--fg-2);font-size:var(--fs-meta);font-weight:500;cursor:pointer}
.seg button svg.i{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.input{width:100%;height:32px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r-row);background:var(--surface);color:var(--fg);font:var(--fs-body) var(--font-ui)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input:disabled{background:var(--hover);color:var(--fg-2)}
.input.err{border-color:var(--danger)}
.errtxt{font-size:var(--fs-meta);color:var(--danger);margin-top:4px}
.check{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-strong);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0}
.check svg.i{width:12px;height:12px;stroke-width:2.5;opacity:0}
.check[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.check[aria-checked="true"] svg.i{opacity:1}

/* window */
.window{position:relative;flex:1;min-height:0;display:grid;grid-template-rows:40px minmax(0,1fr);background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.window.win{border-radius:8px}
.titlebar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;user-select:none}
.tb-left{display:flex;align-items:center;gap:4px;padding-left:10px;min-width:0}
.tb-right{display:flex;align-items:center;gap:4px;justify-self:end;height:100%}
.window.mac .tb-right{padding-right:10px}
.lights{display:none;gap:8px;padding:0 10px 0 4px}
.lights span{width:12px;height:12px;border-radius:50%}
.lights span:nth-child(1){background:#ff5f57}.lights span:nth-child(2){background:#febc2e}.lights span:nth-child(3){background:#28c840}
.window.mac .lights{display:flex}
.wc{display:none;height:100%;margin-left:4px}
.window.win .wc{display:flex}
.wc button{width:46px;height:100%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);cursor:default}
.wc button:hover{background:var(--hover)}
.wc button.close:hover{background:#c42b1c;color:#fff}
.wc svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1}
.collapsed-only{display:none}
.window.sb-hidden .collapsed-only{display:inline-grid}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;max-width:min(460px,46vw);padding:0 10px 0 4px;border:1px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;min-width:0}
.pill:hover{border-color:var(--border-strong)}
.pill[aria-expanded="true"]{background:var(--selected);border-color:var(--border-strong)}
.pill .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pill .tin{font-size:var(--fs-meta);color:var(--fg-2);white-space:nowrap}
.pill .bc{display:none;font-size:var(--fs-meta);color:var(--fg-2)}
.pill svg.i{width:14px;height:14px;color:var(--fg-3)}

.body{display:flex;min-height:0}
.sidebar{width:248px;flex-shrink:0;display:flex;flex-direction:column;padding:4px 8px 8px;min-height:0}
.window.sb-hidden .sidebar{display:none}
.sb-top{display:flex;gap:4px;align-items:center}
.searchbtn{flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border:1px solid var(--border);border-radius:var(--r-row);background:var(--surface);color:var(--fg-3);cursor:pointer;min-width:0}
.searchbtn:hover{border-color:var(--border-strong);color:var(--fg-2)}
.searchbtn .lbl{flex:1;text-align:left}
kbd{font:500 var(--fs-cap) var(--font-ui);color:var(--fg-3);border:1px solid var(--border);border-radius:4px;padding:0 4px;height:18px;display:inline-flex;align-items:center}
.sb-scroll{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px;padding-top:12px}
.sb-foot{display:flex;flex-direction:column;gap:2px;padding-top:8px;position:relative}
.account{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;border-radius:var(--r-row);background:transparent;cursor:pointer;text-align:left}
.account:hover,.account[aria-expanded="true"]{background:var(--hover)}
.account .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.account .who b{font-weight:500;font-size:var(--fs-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account .who span{font-size:var(--fs-meta);color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account svg.i{color:var(--fg-3)}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 4px);background:var(--raised);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--pop);padding:4px;z-index:25}
.menu .head{padding:8px 8px 8px;font-size:var(--fs-meta);color:var(--fg-3);border-bottom:1px solid var(--border);margin-bottom:4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);margin:0 8px 8px 0;overflow:hidden;container-type:inline-size}
.window.sb-hidden .main{margin-left:8px}
.window.panel-open .main{margin-right:0}
.main-scroll{flex:1;overflow:auto}
.content{max-width:880px;margin:0 auto;padding:28px 32px 56px}
.rpanel{display:none;width:320px;flex-shrink:0;flex-direction:column;min-height:0}
.window.panel-open .rpanel{display:flex}
.rp-head{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 20px;flex-shrink:0}
.rp-head h2{flex:1;margin:0;font-size:var(--fs-emph);font-weight:600}
.rp-scroll{flex:1;overflow:auto;padding:0 12px 12px 12px}

/* page */
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph-text{flex:1;min-width:0}
.ph h1{margin:0;font-size:var(--fs-page);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.ph .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;color:var(--fg-2);font-size:var(--fs-meta)}
.sep-dot{width:3px;height:3px;border-radius:50%;background:var(--fg-3)}
.ph-actions{display:flex;gap:8px}
.lede{color:var(--fg-2);margin:6px 0 0;max-width:62ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:20px 0 24px;overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--fg-2);font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .count{font-size:var(--fs-cap);padding:0 6px;border-radius:999px;background:var(--hover);color:var(--fg-2);line-height:18px}
h2.sec{font-size:var(--fs-title);font-weight:600;margin:32px 0 12px}
h2.sec:first-child{margin-top:0}

/* disclosure */
.disc-group{border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.disc+.disc{border-top:1px solid var(--border)}
.disc-head{display:flex;align-items:center;gap:8px;padding-right:12px}
.disc-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 12px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600}
.disc-toggle .chev{color:var(--fg-3);transition:transform .15s}
.disc.open .chev{transform:rotate(90deg)}
.disc-meta{font-weight:400;font-size:var(--fs-meta);color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disc-body{display:none;padding:4px 20px 20px 36px}
.disc.open .disc-body{display:block}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 32px;margin:0}
.field{min-width:0}
.field.full{grid-column:1/-1}
.field dt{display:flex;align-items:center;gap:8px;font-size:var(--fs-meta);color:var(--fg-2);margin-bottom:4px;min-height:20px}
.field dt .grow{flex:1}
.field dd{margin:0;overflow-wrap:anywhere}
.field.inh dd{color:var(--fg-2)}
.inh-ctl{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-cap);color:var(--fg-3)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* lists */
.list{border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.row{display:grid;align-items:center;gap:12px;min-height:52px;padding:8px 16px}
.row+.row{border-top:1px solid var(--border)}
.row.click{cursor:pointer}
.row.click:hover{background:var(--hover)}
.row.dim{color:var(--fg-3)}
.row.dim .code{color:var(--fg-3)}
.code{font-family:var(--font-num);font-size:var(--fs-meta);font-weight:600;font-variant-numeric:tabular-nums}
.rname{min-width:0}
.rname b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname span{display:block;font-size:var(--fs-meta);color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.dim .rname b{color:var(--fg-3)}
.num{font-size:var(--fs-meta);color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.r-forms{grid-template-columns:16px 68px minmax(0,1fr) 84px 104px 112px}
.r-due{grid-template-columns:44px 68px minmax(0,1fr) 88px 96px}
.r-tpl{grid-template-columns:68px minmax(0,1fr) 140px 96px}
.r-filed{grid-template-columns:68px minmax(0,1fr) 104px 132px}
.datebox{width:44px;text-align:center;line-height:1.1}
.datebox small{display:block;font-size:var(--fs-cap);font-weight:600;color:var(--fg-3);letter-spacing:.06em}
.datebox b{font-size:var(--fs-title);font-weight:600;font-variant-numeric:tabular-nums}
.toolbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .grow{flex:1}
.packs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.packs .lbl{font-size:var(--fs-meta);color:var(--fg-3);margin-right:2px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-card);background:var(--accent-soft);margin-bottom:16px}
.banner p{flex:1;margin:0;min-width:200px}
.empty{padding:40px 16px;text-align:center;color:var(--fg-3)}
.srow{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--border)}
.srow:first-of-type{border-top:0}
.srow .txt{flex:1;min-width:0}
.srow .txt b{display:block;font-weight:500}
.srow .txt span{display:block;font-size:var(--fs-meta);color:var(--fg-3)}
.card{border:1px solid var(--border);border-radius:var(--r-card);padding:4px 16px}

/* right panel content */
.tp-hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px 8px 16px}
.tp-hero .edit{position:absolute;top:8px;right:0}
.tp-hero h3{margin:4px 0 0;font-size:var(--fs-title);font-weight:600;text-wrap:balance}
.tp-hero .tin{font-size:var(--fs-meta);color:var(--fg-2)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;margin:0 8px 4px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.facts dt{font-size:var(--fs-meta);color:var(--fg-3);display:flex;align-items:center;gap:6px}
.facts dd{margin:0;font-size:var(--fs-body);min-width:0;overflow-wrap:anywhere}
.p-edit{display:flex;flex-direction:column;gap:12px;padding:4px 8px 8px}
.p-edit label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-meta);color:var(--fg-2)}
.notif{display:flex;gap:12px;padding:10px 8px;border-radius:var(--r-row)}
.notif:hover{background:var(--hover)}
.notif .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--hover);color:var(--fg-2)}
.notif .ico.warning{background:var(--warning-soft);color:var(--warning)}
.notif .ico.success{background:var(--success-soft);color:var(--success)}
.notif .tx{flex:1;min-width:0}
.notif .tx b{display:block;font-weight:500}
.notif .tx span{display:block;font-size:var(--fs-meta);color:var(--fg-3)}
.notif .when{font-size:var(--fs-cap);color:var(--fg-3);white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.notif .udot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* overlays */

function profileFill(label,itemLabel){

    case 'chk':return `<label class="chkl"><input type="checkbox" data-fid="${id}" ${v==='1'?'checked':''} ${f.c?'disabled':''}>${esc(f.l||itemLabel)}</label>`;

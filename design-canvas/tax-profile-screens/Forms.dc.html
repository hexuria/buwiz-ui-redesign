<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tax profile, Forms tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit}
a{color:#2557d6}a:hover{color:#1b45ad}
</style>
</helmet>
<div style="width: 100%; min-height: 860px; display: flex; flex-direction: column; box-sizing: border-box; background: #f4f4f6; color: #18181b; font-family: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 13px; line-height: 1.45">

<header style="display: flex; align-items: center; height: 40px; flex-shrink: 0">
  <div style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 4px; padding-left: 10px">
    <button aria-label="Toggle sidebar" style="width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #54545d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
    <button aria-label="Back" style="width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #54545d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    <button aria-label="Forward" style="width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #a8a8b0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <button aria-label="Search" style="width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #54545d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button aria-label="New return" style="width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #54545d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
  </div>
  <button aria-label="Tax profile" aria-expanded="false" style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 4px; border: 1px solid #e2e2e6; border-radius: 999px; background: #ffffff; min-width: 0">
    <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; background: #dbe3f7; color: #22397a; font-size: 9px; font-weight: 600">GC</span>
    <span style="font-weight: 600; white-space: nowrap">Goldcoders Corp</span>
    <span style="font-family: 'Cascadia Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #54545d; white-space: nowrap">009-123-456-00000</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div style="flex: 1 1 0; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 4px; height: 100%">
    <button aria-label="Notifications" style="position: relative; width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #54545d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg><span style="position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: #2557d6; box-shadow: 0 0 0 2px #f4f4f6"></span></button>
    <button aria-label="Theme: light" style="width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #54545d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
    <div aria-hidden="true" style="display: flex; height: 100%; margin-left: 4px">
      <span style="width: 46px; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#18181b" stroke-width="1"><path d="M0 5.5h10"/></svg></span>
      <span style="width: 46px; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#18181b" stroke-width="1"><rect x=".5" y=".5" width="9" height="9" rx="1"/></svg></span>
      <span style="width: 46px; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#18181b" stroke-width="1"><path d="M0 0l10 10M10 0L0 10"/></svg></span>
    </div>
  </div>
</header>

<main style="flex: 1; min-width: 0; background: #ffffff; border: 1px solid #e2e2e6; border-radius: 12px; margin: 0 8px 8px 8px; box-sizing: border-box">
  <div style="max-width: 880px; margin: 0 auto; padding: 28px 32px 40px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
      <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; background: #dbe3f7; color: #22397a; font-size: 14px; font-weight: 600; flex-shrink: 0">GC</span>
      <div style="flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Goldcoders Corp</h1>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; color: #54545d; font-size: 12px"><span style="font-family: 'Cascadia Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace">009-123-456-00000</span><span style="width: 3px; height: 3px; border-radius: 50%; background: #71717a"></span><span>Head office</span><span style="width: 3px; height: 3px; border-radius: 50%; background: #71717a"></span><span>Corporation</span></div>
      </div>
      <div style="display: flex; gap: 8px">
        <button style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #cdcdd3; border-radius: 6px; background: #ffffff; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Copy TIN</button>
        <button style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #18181b; border-radius: 6px; background: #18181b; color: #ffffff; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New return</button>
      </div>
    </div>

    <div role="tablist" style="display: flex; gap: 4px; border-bottom: 1px solid #e2e2e6; margin: 20px 0 24px">
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: #54545d; font-weight: 500">Profile</button>
      <button role="tab" aria-selected="true" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 0; border-bottom: 2px solid #18181b; margin-bottom: -1px; background: none; font-weight: 500">Forms<span style="font-size: 11px; padding: 0 6px; border-radius: 999px; background: #ebebee; color: #54545d; line-height: 18px">7</span></button>
      <button role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: #54545d; font-weight: 500">Templates<span style="font-size: 11px; padding: 0 6px; border-radius: 999px; background: #ebebee; line-height: 18px">2</span></button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 16px">
      <div style="display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: #ebebee">
        <button aria-pressed="false" style="height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #54545d; font-size: 12px; font-weight: 500">2025</button>
        <button aria-pressed="true" style="height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: #ffffff; font-size: 12px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.1)">2026</button>
        <button aria-pressed="false" style="height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #54545d; font-size: 12px; font-weight: 500">2027</button>
      </div>
      <span style="flex: 1"></span>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
        <span style="font-size: 12px; color: #71717a; margin-right: 2px">Starter packs</span>
        <button style="height: 28px; padding: 0 10px; border: 1px solid #cdcdd3; border-radius: 6px; background: #ffffff; font-weight: 500">Non-VAT business</button>
        <button style="height: 28px; padding: 0 10px; border: 1px solid #cdcdd3; border-radius: 6px; background: #ffffff; font-weight: 500">VAT business</button>
        <button style="height: 28px; padding: 0 10px; border: 1px solid #cdcdd3; border-radius: 6px; background: #ffffff; font-weight: 500">Employer</button>
        <button style="height: 28px; padding: 0 10px; border: 1px solid #cdcdd3; border-radius: 6px; background: #ffffff; font-weight: 500">Professional</button>
      </div>
    </div>

    <div style="border: 1px solid #e2e2e6; border-radius: 12px; overflow: hidden">
      <sc-for list="{{forms}}" as="f" hint-placeholder-count="10">
        <div style="display: grid; grid-template-columns: 16px 68px minmax(0, 1fr) 84px 104px 112px; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; box-sizing: border-box; border-top: {{f.border}}">
          <sc-if value="{{f.on}}" hint-placeholder-val="{{ true }}">
            <button role="checkbox" aria-checked="true" aria-label="File {{f.code}} in 2026" style="width: 16px; height: 16px; padding: 0; border: 1px solid #18181b; border-radius: 4px; background: #18181b; display: inline-grid; place-items: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
          </sc-if>
          <sc-if value="{{f.off}}" hint-placeholder-val="{{ false }}">
            <button role="checkbox" aria-checked="false" aria-label="File {{f.code}} in 2026" style="width: 16px; height: 16px; padding: 0; border: 1px solid #cdcdd3; border-radius: 4px; background: #ffffff"></button>
          </sc-if>
          <span style="font-family: 'Cascadia Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; color: {{f.codeColor}}">{{f.code}}</span>
          <span style="min-width: 0">
            <span style="display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: {{f.nameColor}}">{{f.name}}</span>
            <span style="display: block; font-size: 12px; color: #71717a">{{f.sub}}</span>
          </span>
          <span><sc-if value="{{f.on}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: #ebebee; color: #54545d; font-size: 11px; font-weight: 500">{{f.freq}}</span></sc-if></span>
          <span style="font-size: 12px; white-space: nowrap; color: {{f.dueColor}}; font-weight: {{f.dueWeight}}">{{f.due}}</span>
          <span>
            <sc-if value="{{f.tpl}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; background: rgba(21,122,60,.10); color: #157a3c; font-size: 11px; font-weight: 500"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/></svg>Template</span></sc-if>
            <sc-if value="{{f.noTpl}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: #ebebee; color: #54545d; font-size: 11px; font-weight: 500">No template</span></sc-if>
          </span>
        </div>
      </sc-for>
    </div>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() {
var rows = [
['1601-C', 'Monthly Remittance Return of Income Taxes Withheld on Compensation', true, 'Next: October 2026', 'Monthly', 'Due Nov 10', true, false],
['0619-E', 'Monthly Remittance Form for Creditable Income Taxes Withheld (Expanded)', true, 'Next: October 2026', 'Monthly', 'Due Nov 10', false, false],
['1601-EQ', 'Quarterly Remittance Return of Creditable Income Taxes Withheld (Expanded)', true, 'Next: Q3 2026', 'Quarterly', 'Due Oct 31', false, false],
['2550Q', 'Quarterly Value-Added Tax Return', true, 'Next: Q3 2026', 'Quarterly', 'Due Oct 25', true, true],
['1702Q', 'Quarterly Income Tax Return for Corporations', true, 'Next: Q3 2026', 'Quarterly', 'Due Nov 29', false, false],
['1702-RT', 'Annual Income Tax Return for Corporations (Regular Rate)', true, 'Next: TY 2026', 'Annual', 'Due Apr 15, 2027', false, false],
['1604-C', 'Annual Information Return of Income Taxes Withheld on Compensation', true, 'Next: 2026', 'Annual', 'Due Jan 31, 2027', false, false],
['2551Q', 'Quarterly Percentage Tax Return', false, 'Not filed this year', '', '', false, false],
['1701Q', 'Quarterly Income Tax Return for Individuals', false, 'Not filed this year', '', '', false, false],
['1701', 'Annual Income Tax Return for Individuals', false, 'Not filed this year', '', '', false, false]
];
return {
forms: rows.map(function (r, i) {
return {
code: r[0], name: r[1], on: r[2], off: !r[2], sub: r[3], freq: r[4], due: r[5],
tpl: r[2] && r[6], noTpl: r[2] && !r[6],
border: i === 0 ? '0' : '1px solid #e2e2e6',
codeColor: r[2] ? '#18181b' : '#71717a',
nameColor: r[2] ? '#18181b' : '#71717a',
dueColor: r[7] ? '#a5520a' : '#54545d',
dueWeight: r[7] ? '600' : '400'
};
})
};
}
}
</script>
</body>
</html>
